<div *ngIf="mostrarLogin" [@fadeAnimation]  class="container d-flex justify-content-center align-items-center min-vh-100">
    <main class="form-signin w-100">
      <form [formGroup]="form">
        <div class="text-center mb-4">
          <img
            class="mb-4"
            src="image/logo.jpg"
            alt=""
            width="150rem"
            height="150rem"
          />
        </div>
        <h1 class="h3 mb-3 fw-normal text-center">Registrese para comenzar</h1>
  
        <div class="form-floating">
          <input
            type="name"
            class="form-control"
            id="floatingInput"
            placeholder="nombre"
            formControlName="nombre"
          />
          <label for="floatingInput">Nombre</label>
        </div>
        <div class="form-floating">
          <input
            type="name"
            class="form-control"
            id="floatingInput"
            placeholder="apellido"
            formControlName="apellido"
          />
          <label for="floatingInput">Apellido</label>
        </div>
        <div class="form-floating">
          <input
            type="number"
            class="form-control"
            id="floatingInput"
            placeholder="dni"
            formControlName="dni"
          />
          <label for="floatingInput">DNI</label>
        </div>
        <div class="form-floating">
          <input
            type="number"
            class="form-control"
            id="floatingInput"
            placeholder="edad"
            formControlName="edad"
          />
          <label for="floatingInput">Edad</label>
        </div>
        
        <label  for="especialidades">Especialidades</label>
        <div class="checkbox-container  "><!-- Añadido margen inferior -->
          <div  class="form-floating" >
            <div *ngFor="let esp of especialidadesDisponibles" class="form-check">
              <input
                type="checkbox"
                id="{{ esp }}"
                [value]="esp"
                (change)="onEspecialidadChange($event)"
                [checked]="selectedEspecialidades.has(esp)"
                class="form-check-input"
              />
              <label class="form-check-label" for="{{ esp }}">{{ esp }}</label>
            </div>
          </div>
        </div>
        
        <div class="form-floating ">
          <input
            type="name"
            class="form-control"
            placeholder="Otra especialidad"
            [(ngModel)]="especialidadPersonalizada"
            formControlName="especialidadPersonalizada"
          />
          <label for="especialidadPersonalizada">Otra especialidad</label>
        </div>
        <div class="form-floating">
          <input
            type="email"
            class="form-control"
            id="floatingInput"
            placeholder="name@example.com"
            formControlName="email"
          />
          <label for="floatingInput">Email address</label>
        </div>
        <div class="form-floating">
          <input
            type="password"
            class="form-control"
            id="floatingPassword"
            placeholder="Password"
            formControlName="password"
          />
          <label for="floatingPassword">Password</label>
        </div>

        <div class="form-floating mb-3">
            <input
              type="file"
              class="form-control file-input"
              id="fileInput"
              (change)="onFileSelected($event)"
            />
            <label for="fileInput" class="file-label">Foto</label>
          </div>
  
        <button
          class="btn btn-primary w-100 py-2"
          type="submit"
          (click)="handleRegister()"
        >
        Registrase
        </button>
        <p class="mt-5 mb-3 text-body-secondary text-center">&copy; 2017–2024</p>
      </form>
    </main>
  </div>
