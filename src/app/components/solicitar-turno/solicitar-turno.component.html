<div class="container mt-3">
    <h2>Solicitar Turno</h2>

    <form [formGroup]="turnoForm" (ngSubmit)="solicitarTurno()">

      <div class="form-group mb-3">
        <label for="especialidad">Especialidad</label>
        <select id="especialidad" class="form-control" formControlName="especialidad">
          <option [selected]="true" value="{{ datosTurno.especialidad }}">{{ datosTurno.especialidad }}</option>
        </select>
      </div>
  
      <div class="form-group mb-3" *ngIf="especialistaSeleccionado">
        <label for="especialista">Especialista</label>
        <select id="especialista" class="form-control" formControlName="especialista" required>
            <option [selected]="true" value="{{ especialistaSeleccionado?.nombre  }} "> {{ especialistaSeleccionado?.nombre }} {{especialistaSeleccionado?.nombre}} </option>
        </select>
      </div>      

  
      <div class="form-group mb-3">
        <label for="fechaHora">Fecha y Hora</label>
        <select id="fechaHora" class="form-control" formControlName="fechaHora" (change)="onHorarioSeleccionado($event)">
          <option *ngFor="let disp of horariosDisponibles" [ngValue]="disp">
            {{ disp.dia }} - {{ disp.mes }} - {{ disp.anio }} {{ disp.horaInicio }} {{ disp.horaFin }}
          </option>
        </select>
      </div>
      
      <div class="form-group mb-3" *ngIf="esAdmin == true">
        <label for="paciente">Paciente</label>
        <select 
          id="paciente" 
          class="form-control" 
          formControlName="paciente" 
          >
          <option *ngFor="let paciente of pacientes" [ngValue]="paciente">
            {{ paciente.nombre }} {{ paciente.apellido }}
          </option>
        </select>
      </div>
      
  
      <button type="submit" class="btn btn-primary" [disabled]="!turnoForm.valid">Solicitar Turno</button>
    </form>
  </div>
