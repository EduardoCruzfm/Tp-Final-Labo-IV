<div class="container mt-3">
    <h2>Solicitar Turno</h2>

    <form [formGroup]="turnoForm" (ngSubmit)="solicitarTurno()">

      <div class="form-group mb-3">
        <label for="especialidad">Especialidad</label>
        <select id="especialidad" class="form-control" formControlName="especialidad">
          <option [selected]="true" value="{{ datosTurno.especialidad }}">{{ datosTurno.especialidad }}</option>
        </select>
      </div>
  
      <div class="form-group mb-3" *ngIf="especialistaSeleccionado">
        <label for="especialista">Especialista</label>
        <select id="especialista" class="form-control" formControlName="especialista" required>
            <option [selected]="true" value="{{ especialistaSeleccionado?.nombre }} "> {{ especialistaSeleccionado?.nombre }} {{especialistaSeleccionado?.apellido}} </option>
        </select>
      </div>      

      <div class="form-group mb-3">
        <label>Días con turnos disponibles</label>
        <div class="d-flex flex-wrap">
          <button 
            *ngFor="let fecha of fechasDisponibles" 
            type="button" 
            class="btn btn-outline-primary m-1" 
            [ngClass]="{'btn-success': fecha.diaConFormato === fechaSeleccionada?.diaConFormato && fecha.mesNumerico === fechaSeleccionada?.mesNumerico}"  
            (click)="seleccionarFecha(fecha)"
          >
            {{fecha.diaConFormato}}/{{fecha.mesNumerico}}
          </button>
        </div>
      </div>
  
      <div class="form-group mb-3" *ngIf="fechaSeleccionada">
        <label>Horarios disponibles</label>
        <div class="d-flex flex-wrap">
          <button 
            *ngFor="let horario of horariosDisponibles" 
            type="button" 
            class="btn btn-outline-primary m-1" 
            [ngClass]="{'btn-success': horario === horaSeleccionada}"  
            (click)="seleccionarHora(horario)"
          >
            {{ horario.horaInicio }}
          </button>
        </div>
      </div>
  
      <div class="form-group mb-3">
        <label for="fechaHora">Fecha y Hora</label>
        <input id="fechaHora" class="form-control" formControlName="fechaHora"
               [value]="setParaForm" />
               <!-- [value]="fechaSeleccionada ? (fechaSeleccionada.diaCadena + ' ' + fechaSeleccionada.mesCadena) : ''" /> -->
      </div>
      
     
      
      <div class="form-group mb-3" *ngIf="esAdmin == true">
        <label for="paciente">Paciente</label>
        <select 
          id="paciente" 
          class="form-control" 
          formControlName="paciente" 
          >
          <option *ngFor="let paciente of pacientes" [ngValue]="paciente">
            {{ paciente.nombre }} {{ paciente.apellido }}
          </option>
        </select>
      </div>
      
  
      <button type="submit" class="btn btn-primary" [disabled]="!turnoForm.valid">Solicitar Turno</button>
    </form>
  </div>
